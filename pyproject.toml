[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "metarmap2"
dynamic = ["version"]  # read from the newest git release tag by metarmap.__version__
description = "Raspberry Pi METAR map: NeoPixel LEDs, an OLED screen and a web UI"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Darryl Quinn" }]
requires-python = ">=3.9"
dependencies = [
    "adafruit-circuitpython-led-animation>=2.6",
    "astral>=2.2",
    "bottle>=0.12",
    "requests>=2.25",
    "schedule>=1.1",
    "tzdata",
    "urllib3>=1.26",  # http.py imports it directly (Retry, ReadTimeoutError), not only through requests
]

[project.optional-dependencies]
# hardware drivers, only needed on the Raspberry Pi
pi = [
    "adafruit-blinka",
    "adafruit-circuitpython-neopixel",
    "adafruit-circuitpython-ssd1306",
    "oled-text",
    "rpi_ws281x",
]
# announces the map on the network. Not a required dependency: newer releases have no ready-made package for a Pi
# Zero (Python 3.9 on armv6l) and would be compiled there, which takes over ten minutes and fails. install.sh and Home's
# "Install network discovery" install it with --only-binary, which takes the newest release that has a ready-made
# package (0.39.4, pure Python, on a Pi Zero)
network = ["zeroconf"]
dev = [
    "pytest>=7",
    "pytest-xdist>=3",  # pytest runs the tests on every core (addopts -n auto); -n0 runs one test in the foreground
    "mypy==1.19.1",  # CI type check, pinned like ruff: the newest that installs on Python 3.9 (2.x needs 3.10)
    "types-requests",  # mypy 1.19 reports requests as untyped without these stubs
    "ruff==0.17.2",  # the same version as .pre-commit-config.yaml: the formatter's output can change between versions
]

[project.urls]
Homepage = "https://github.com/dman776/metarmap2"

[project.scripts]
metarmap = "metarmap.app:main"

[tool.setuptools.dynamic]
version = { attr = "metarmap.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
metarmap = ["web/templates/*.tpl", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -n auto"
# a warning fails the test that causes it, so a new one is seen at once instead of hiding among old ones
filterwarnings = ["error"]

[tool.mypy]
files = ["src/metarmap"]
check_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B", "RUF100", "I", "SIM", "UP"]
ignore = [
    "SIM108",  # the ternaries it wants are over 120 columns; the if/else reads better
    "UP006",  # typing.List/Dict to list/dict: kept as is, ~190 rewrites across ~30 files for no behaviour gain
    "UP035",  # same churn: deprecated typing imports
    "SIM905",  # a plain "a b c".split() beats a long list literal of strings
]

[tool.ruff.format]
# ruff format's defaults (Black's style); the pre-commit hook and CI check it
