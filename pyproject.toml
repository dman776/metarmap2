[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "metarmap2"
dynamic = ["version"]  # metarmap.__version__ is the one place to change it
description = "Raspberry Pi METAR map: NeoPixel LEDs, an OLED screen and a web UI"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Darryl Quinn" }]
requires-python = ">=3.9"
dependencies = [
    "adafruit-circuitpython-led-animation>=2.6",
    "astral>=2.2",
    "bottle>=0.12",
    "requests>=2.25",
    "schedule>=1.1",
    "tzdata",
    "zeroconf>=0.100",  # announces the map on the network; optional at run time (Home installs it)
]

[project.optional-dependencies]
# hardware drivers, only needed on the Raspberry Pi
pi = [
    "adafruit-blinka",
    "adafruit-circuitpython-neopixel",
    "adafruit-circuitpython-ssd1306",
    "oled-text",
    "rpi_ws281x",
]
dev = [
    "pytest>=7",
    "ruff==0.17.2",  # the same version as .pre-commit-config.yaml: the formatter's output can change between versions
]

[project.urls]
Homepage = "https://github.com/dman776/metarmap2"

[project.scripts]
metarmap = "metarmap.app:main"

[tool.setuptools.dynamic]
version = { attr = "metarmap.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
metarmap = ["web/templates/*.tpl", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
# a warning fails the test that causes it, so a new one is seen at once instead of hiding among old ones
filterwarnings = ["error"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]

[tool.ruff.format]
# ruff format's defaults (Black's style); the pre-commit hook and CI check it
