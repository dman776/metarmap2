name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # 24.04, not ubuntu-latest: 26.04's setup-python has no 3.9, which the Pis on Bullseye still run
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false  # a failure on one Python doesn't cancel the other's run
      matrix:
        # 3.9 = Raspberry Pi OS Bullseye, 3.11 = Bookworm
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Test
        run: pytest
