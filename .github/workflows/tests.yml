name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # 24.04, not ubuntu-latest: 26.04's setup-python has no 3.9, which the Pis on Bullseye still run
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false  # a failure on one Python doesn't cancel the other's run
      matrix:
        # 3.9 = Raspberry Pi OS Bullseye, 3.11 = Bookworm
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the version is read from the git release tags
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install rsvg-convert
        # tests/test_icon_masks.py checks web/icon_masks.py against a fresh render of the icons, and skips without it
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        # one Python is enough: the check reads the code, not the runtime
        if: matrix.python-version == '3.9'
        run: mypy
      - name: Test
        run: pytest

  js:
    # the Web pages' JavaScript, in jsdom (tests/js); dev-only, nothing here ships to the Chart
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
